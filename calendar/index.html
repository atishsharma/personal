<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hindu Calendar and Panchang | Tithi, Festivals, Rahu Kaal</title>
<meta name="description" content="A Hindu calendar with a daily panchang worked out from the real positions of the sun and moon: tithi, nakshatra, yoga, karana, sunrise, Rahu Kaal, festivals and Ekadashi dates. Times for Chandigarh.">
<meta name="theme-color" content="#101532">
<link rel="icon" href="../master/logo_favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Hind:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eceff4; --surface:#fbfcfd; --ink:#12172b; --mute:#5a6078; --line:#d5dae6;
  --accent:#e8a41a; --fest:#b8301f; --vrat:#3f51b5; --tint:#f1ecda;
  --night:#101532; --night-2:#1a2048; --night-ink:#fff; --night-mute:rgba(255,255,255,.84);
  --moon-lit:#fff6dc; --moon-dark:rgba(8,10,40,.55);
  --ring:#12172b; --wm-op:.1;
  --p1:#1E6FD9; --p2:#3F2FB5;
  --grad:linear-gradient(rgba(0,0,0,.16),rgba(0,0,0,.16)),linear-gradient(150deg,var(--p1),var(--p2));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000; --wm-op:.26; --surface:#141934; --ink:#eceffa; --mute:#9aa2c6; --line:#262d52;
    --accent:#f0b030; --fest:#ff8a73; --vrat:#93a3ff; --tint:#1d2447;
    --night:#1a2048; --night-2:#232a5a; --ring:#eceffa;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --wm-op:.26; --surface:#141934; --ink:#eceffa; --mute:#9aa2c6; --line:#262d52;
  --accent:#f0b030; --fest:#ff8a73; --vrat:#93a3ff; --tint:#1d2447;
  --night:#1a2048; --night-2:#232a5a; --ring:#eceffa;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);min-height:100vh;
  font-family:'Familjen Grotesk','Hind',system-ui,sans-serif;font-size:1rem;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wm{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:grid;grid-template-columns:repeat(auto-fill,52px);grid-auto-rows:52px;place-items:center;font-size:20px;font-weight:800;color:var(--p1);opacity:var(--wm-op)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:linear-gradient(135deg,var(--a),var(--b))}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.swatches{display:flex;gap:10px;align-items:center;padding:0 4px}
.site a{color:inherit}
.site{position:relative;z-index:2;background:var(--surface);border-bottom:1px solid var(--line)}
.site .in{max-width:1280px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:700;font-size:1.1rem;letter-spacing:-.01em;margin-right:auto}
.brand img{width:36px;height:36px;border-radius:10px;object-fit:cover}
.brand small{display:block;font-weight:500;font-size:.78rem;color:var(--mute);letter-spacing:0;line-height:1.1}
.site nav{display:flex;gap:6px;align-items:center}
.site nav a{text-decoration:none;font-weight:600;padding:8px 12px;border-radius:10px}
.site nav a:hover{background:var(--tint)}
.site nav a[aria-current="page"]{background:var(--p2);color:#fff}
.foot{position:relative;z-index:1;max-width:1280px;margin:8px auto 0;padding:22px 20px 34px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;color:var(--mute);font-size:.92rem}
.foot a{color:inherit;text-underline-offset:4px}
.foot a:hover{color:var(--ink)}
.foot nav{display:flex;gap:18px}

.site{position:relative;z-index:30}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);align-items:center;justify-content:center;cursor:pointer}
.burger .x{display:none}.burger[aria-expanded="true"] .b{display:none}.burger[aria-expanded="true"] .x{display:block}
@media (max-width:760px){
  .burger{display:inline-flex}
  .brand span{white-space:nowrap}
  .site nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:2px;padding:8px 16px 14px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 22px 30px -14px rgba(0,0,0,.35)}
  .site nav.open{display:flex}
  .site nav a{padding:14px 12px;font-size:1.05rem}
}
.app{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:20px;display:grid;grid-template-columns:380px minmax(0,1fr);gap:20px;align-items:start}

/* ---------- today panel (always a night sky) ---------- */
.panel{
  background:var(--grad);color:#fff;border-radius:28px;padding:28px 26px 24px;
  box-shadow:0 18px 50px -18px var(--p2);
  position:sticky;top:20px;
}
.moonwrap{display:flex;align-items:center;gap:22px}
.moon{flex:none;width:132px;height:132px}
.moon-meta{font-size:.95rem;color:var(--night-mute);line-height:1.4}
.moon-meta b{display:block;font-size:1.5rem;color:var(--night-ink);font-weight:600;line-height:1.15}
.date{margin-top:26px;display:flex;align-items:flex-end;gap:16px}
.date .num{font-size:5.4rem;font-weight:700;line-height:.8;letter-spacing:-.04em}
.date .txt{padding-bottom:4px;color:var(--night-mute)}
.date .txt b{display:block;color:var(--night-ink);font-size:1.25rem;font-weight:600}
.hindu{margin-top:18px;font-size:1.2rem;font-weight:500;line-height:1.35}
.hindu small{display:block;margin-top:2px;font-size:.95rem;color:var(--night-mute);font-weight:400}
.evs{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ev{font-size:.9rem;font-weight:700;padding:4px 12px;border-radius:99px;background:#fff;color:#14172b}
.ev.vrat{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85)}
.none{margin-top:16px;color:var(--night-mute);font-size:.95rem}

.sun{margin-top:26px}
.arc{display:block;width:100%;height:auto;overflow:visible}
.ends{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;margin-top:8px;text-align:left}
.ends div{display:flex;flex-direction:column}
.ends div:last-child{text-align:right;align-items:flex-end}
.ends .mid{text-align:center;align-items:center;padding-top:2px}
.ends b{font-size:1.15rem;font-weight:700;line-height:1.2}
.ends span{font-size:.85rem;color:var(--night-mute)}
.bar-legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:18px;padding-top:14px;border-top:1px solid #ffffff40;font-size:.92rem}
.bar-legend div{display:flex;flex-direction:column}
.bar-legend span{color:var(--night-mute);font-size:.85rem;display:flex;align-items:center;gap:6px}
.bar-legend span::before{content:"";width:10px;height:10px;border-radius:99px;background:#fff}
.bar-legend .b span::before{background:#ffe08a}.bar-legend .r span::before{background:#14172b;box-shadow:0 0 0 1.5px #fff}
.bar-legend b{font-weight:600;font-size:1rem}

.limbs{margin-top:26px;border-top:1px solid #ffffff40}
.limbs div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #ffffff30}
.limbs dt{color:var(--night-mute)}
.limbs dd{font-weight:600;text-align:right}
.place{margin-top:14px;font-size:.85rem;color:var(--night-mute)}

/* ---------- calendar ---------- */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;margin-bottom:16px}
.head h1{font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-right:auto}
.head h1 small{display:block;font-size:.95rem;font-weight:500;color:var(--mute);letter-spacing:0;margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{
  height:42px;min-width:42px;padding:0 14px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--p2);color:#fff;border-color:var(--p2)}
select.btn{appearance:none;padding:0 12px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{height:40px;padding:0 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--p2);color:#fff}

.frame{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--line)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px}
.dow div{background:var(--surface);padding:10px 8px;text-align:center;font-weight:600;color:var(--mute);font-size:.92rem}
.dow div:first-child{color:var(--fest)}
.frame .dow{border-bottom:1px solid var(--line)}
.cell{
  background:var(--surface);min-height:104px;padding:8px 9px 9px;text-align:left;display:flex;flex-direction:column;gap:4px;
  position:relative;min-width:0;
}
.cell:hover{background:var(--tint)}
.cell.out{opacity:.42}
.cell.sel{background:var(--grad);color:#fff;opacity:1}
.cell.sel .t{color:rgba(255,255,255,.85)}
.cell.sel .chip,.cell.sel .chip.v{color:#fff}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.n{font-size:1.15rem;font-weight:600;line-height:1.1;min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:99px;margin:-3px 0 0 -4px}
.cell.today .n{background:var(--p2);color:#fff;font-weight:700}
.cell.sunday .n{color:var(--fest)}
.cell.sel.sunday .n{color:#fff}.cell.sel.today .n{background:#fff;color:#14172b}
.t{display:flex;align-items:center;gap:4px;font-size:.78rem;color:var(--mute);white-space:nowrap}
.t svg{width:16px;height:16px;flex:none}
.chips{display:flex;flex-direction:column;gap:2px;margin-top:auto;min-width:0}
.chip{font-size:.76rem;font-weight:600;line-height:1.2;color:var(--fest);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.v{color:var(--vrat);font-weight:500}
.dots{display:none;gap:3px;margin-top:auto}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--fest)}
.dots i.v{background:var(--vrat)}

.next{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px 8px}
.next h2{font-size:1.3rem;font-weight:700;margin-bottom:8px}
.next ul{list-style:none;padding:0;border-top:1px solid var(--line)}
.next li button{
  width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;
  padding:12px 4px;border-bottom:1px solid var(--line);
}
.next li button:hover{background:var(--tint)}
.next .dd{font-weight:700;font-size:1.05rem}
.next .dd small{display:block;font-weight:500;color:var(--mute);font-size:.8rem}
.next .nm{font-weight:600}
.next .nm.v{font-weight:500;color:var(--vrat)}
.next .when{color:var(--mute);font-size:.9rem}

@media (max-width:1020px){
  .app{grid-template-columns:1fr;padding:14px}
  .panel{position:static}
  .moon{width:104px;height:104px}
  .date .num{font-size:4.2rem}
}
@media (max-width:640px){
  .site .in{padding:0 14px;gap:8px}.site nav a{padding:8px 8px;font-size:.92rem}
  .brand small{display:none}
  .cell{min-height:62px;padding:6px 5px 6px}
  .chips{display:none}.dots{display:flex}
  .t span{display:none}
  .n{font-size:1rem;min-width:26px;height:26px}
  .dow div{padding:8px 2px;font-size:.8rem}
  .head h1{width:100%}
  .next li button{grid-template-columns:56px 1fr}
  .next .when{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .cell,.btn{transition:background-color .12s}
}
</style>
</head>
<body>
<div class="wm" id="wm" aria-hidden="true"></div>
<header class="site">
  <div class="in">
    <a class="brand" href="../" aria-label="Atish Ak Sharma, main site"><img src="../master/logo_favicon.jpg" alt="" width="36" height="36"><span>Atish Ak Sharma<small>ATS Design Studio</small></span></a>
    <button class="burger" id="menuBtn" type="button" aria-expanded="false" aria-controls="menuNav" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path class="b" d="M4 7h16M4 12h16M4 17h16"/><path class="x" d="M6 6l12 12M18 6 6 18"/></svg></button>
    <nav id="menuNav" aria-label="Site">
      <a href="../">Home</a>
      <a href="../#work">Work</a>
      <a href="./" aria-current="page">Calendar</a>
      <a href="../#contact">Contact</a>
      <a href="https://github.com/atishsharma/ats-hindu-calendar-widget">GitHub</a>
    </nav>
  </div>
</header>
<div class="app">
  <aside class="panel" id="panel" aria-live="polite"></aside>

  <main>
    <header class="head">
      <h1 id="title"></h1>
      <div class="tools">
        <button class="btn" id="prev" type="button">‹</button>
        <select class="btn" id="mSel" aria-label="Month"></select>
        <select class="btn" id="ySel" aria-label="Year"></select>
        <button class="btn" id="nextM" type="button">›</button>
        <button class="btn primary" id="todayBtn" type="button"></button>
        <div class="seg" role="group" aria-label="Language">
          <button type="button" id="l-en" aria-pressed="true">EN</button>
          <button type="button" id="l-hi" aria-pressed="false">हिं</button>
        </div>
        <button class="btn" id="themeBtn" type="button"></button>
        <div class="swatches" id="swatches" role="group"></div>
      </div>
    </header>

    <div class="frame">
      <div class="dow" id="dow"></div>
      <div class="grid" id="grid" role="grid"></div>
    </div>

    <section class="next" id="next"></section>
  </main>
</div>

<footer class="foot">
  <span>© 2026 Atish Ak Sharma. All rights reserved. Panchang times are for Chandigarh.</span>
  <nav aria-label="Footer"><a href="../">Main site</a><a href="../#contact">Contact</a><a href="https://github.com/atishsharma/ats-hindu-calendar-widget">GitHub</a></nav>
</footer>

<noscript><p style="padding:16px">This calendar needs JavaScript.</p></noscript>
<script src="panchang.js"></script>
<script>
const $ = s => document.querySelector(s);
const RAD = Math.PI / 180;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const ICON = {
  light: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>',
  auto: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>'
};
const COLORS = [['#1E6FD9', '#3F2FB5'], ['#E8431F', '#B0175F'], ['#2E9E55', '#00796B'], ['#D9770A', '#C13B12']];
let colorIdx = Math.min(3, Math.max(0, +store.get('hc-color') || 0));
let T = null, lang = store.get('hc-lang') === 'hi' ? 'hi' : 'en', theme = store.get('hc-theme') || 'auto';
const now = new Date();
const TODAY = { y: now.getFullYear(), m: now.getMonth(), d: now.getDate() };
let sel = { ...TODAY }, vy = TODAY.y, vm = TODAY.m;
const same = (a, b) => a.y === b.y && a.m === b.m && a.d === b.d;
const P = (o) => Panchang.day(o.y, o.m, o.d);
const norm = o => { const d = new Date(o.y, o.m, o.d); return { y: d.getFullYear(), m: d.getMonth(), d: d.getDate() }; };

/* moon disc: lit part from the sun-moon elongation (northern-sky view, waxing = lit on the right) */
function moonSVG(el, r, litCol, darkCol) {
  const c = r + 1, k = Math.cos(el * RAD), rx = (r * Math.abs(k)).toFixed(2), waxing = el < 180;
  const outer = waxing ? 1 : 0, inner = waxing ? (k > 0 ? 0 : 1) : (k > 0 ? 1 : 0);
  const lit = `M${c},${c - r}A${r},${r} 0 0 ${outer} ${c},${c + r}A${rx},${r} 0 0 ${inner} ${c},${c - r}Z`;
  return `<svg viewBox="0 0 ${2 * c} ${2 * c}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="${darkCol}" stroke="${litCol}" stroke-opacity=".35" stroke-width="${r > 20 ? 1.5 : 1}"/><path d="${lit}" fill="${litCol}"/></svg>`;
}
const label = (e) => e.kind === 'sank' ? `${T[lang].rashis[e.rashi]} ${T[lang].sankranti}` : e.name;
const monthName = p => `${p.adhika ? T[lang].adhika + ' ' : ''}${T[lang].months[p.month]}`;
const fmtLong = (o, opt) => new Date(o.y, o.m, o.d).toLocaleDateString(lang === 'hi' ? 'hi-IN' : 'en-IN', opt);

function renderPanel() {
  const L = T[lang], p = P(sel), isToday = same(sel, TODAY);
  const lit = Math.round((1 - Math.cos(p.el * RAD)) / 2 * 100);
  const ev = p.events;
  const A = { cx: 170, cy: 118, rx: 138, ry: 92 };
  const pt = t => [(A.cx - A.rx * Math.cos(Math.PI * t)).toFixed(1), (A.cy - A.ry * Math.sin(Math.PI * t)).toFixed(1)];
  const arc = (t0, t1) => `M${pt(t0)}A${A.rx},${A.ry} 0 0 1 ${pt(t1)}`;
  const tOf = ms => Math.max(0, Math.min(1, (ms - p.srMs) / (p.ssMs - p.srMs)));
  const nowMs = Date.now(), live = isToday && nowMs >= p.srMs && nowMs <= p.ssMs;
  const [sx, sy] = pt(live ? tOf(nowMs) : 0.5);
  const dl = Math.round((p.ssMs - p.srMs) / 6e4), dayLen = `${Math.floor(dl / 60)}h ${dl % 60}m`;
  const [bx] = pt(0);
  const sunArc = `<svg class="arc" viewBox="0 0 340 150" role="img" aria-label="${L.sunriseL} ${p.sunrise}, ${L.sunsetL} ${p.sunset}, ${L.rahuL} ${p.rahu}">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".95"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient></defs>
    <path d="${arc(0, 1)}Z" fill="url(#sky)"/>
    <path d="${arc(0, 1)}" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>
    ${live ? `<path d="${arc(0, tOf(nowMs))}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>` : ''}
    <path d="${arc(tOf(p.rahuMs[0]), tOf(p.rahuMs[1]))}" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
    <path d="${arc(tOf(p.rahuMs[0]), tOf(p.rahuMs[1]))}" fill="none" stroke="#14172b" stroke-width="8" stroke-linecap="round"/>
    <line x1="10" x2="330" y1="${A.cy}" y2="${A.cy}" stroke="#fff" stroke-opacity=".75" stroke-width="1.5"/>
    <circle cx="${pt(0)[0]}" cy="${A.cy}" r="5" fill="#fff"/><circle cx="${pt(1)[0]}" cy="${A.cy}" r="5" fill="#fff"/>
    <circle cx="${(+bx - 22)}" cy="${A.cy}" r="4.5" fill="#ffe08a"/>
    ${live ? `<circle cx="${sx}" cy="${sy}" r="24" fill="url(#glow)"/><circle cx="${sx}" cy="${sy}" r="9" fill="#ffe9a8" stroke="#fff" stroke-width="2"/>`
           : `<circle cx="${sx}" cy="${sy}" r="8" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2"/>`}
  </svg>`;
  $('#panel').innerHTML = `
    <div class="moonwrap">
      <div class="moon">${moonSVG(p.el, 64, 'var(--moon-lit)', 'var(--moon-dark)')}</div>
      <div class="moon-meta"><b>${p.paksha ? L.waning : L.waxing}</b>${lit}% ${L.lit}<br>${L.pakshas[p.paksha]}</div>
    </div>
    <div class="date">
      <div class="num">${sel.d}</div>
      <div class="txt"><b>${L.days[new Date(sel.y, sel.m, sel.d).getDay()]}</b>${fmtLong(sel, { month: 'long', year: 'numeric' })}${isToday ? ' · ' + L.today : ''}</div>
    </div>
    <div class="hindu">${monthName(p)} · ${L.pakshas[p.paksha]}
      <small>${L.tithis[p.tithiName]} · ${L.vSamvat} ${Panchang.vikramSamvat(sel.y, sel.m, sel.d)}</small></div>
    ${ev.length ? `<div class="evs">${ev.map(e => `<span class="ev ${e.kind === 'vrat' ? 'vrat' : ''}">${label(e)}</span>`).join('')}</div>` : `<p class="none">${L.noEvents}</p>`}
    <div class="sun">
      ${sunArc}
      <div class="ends"><div><b>${p.sunrise}</b><span>${L.sunriseL}</span></div><div class="mid"><b>${dayLen}</b><span>${L.day}</span></div><div><b>${p.sunset}</b><span>${L.sunsetL}</span></div></div>
      <div class="bar-legend">
        <div class="r"><span>${L.rahuL}</span><b>${p.rahu}</b></div>
        <div class="b"><span>${L.brahmaL}</span><b>${p.brahma}</b></div>
      </div>
    </div>
    <dl class="limbs">
      <div><dt>${L.tithiL}</dt><dd>${L.tithis[p.tithiName]} ${L.pakshas[p.paksha].split(' ')[0]} ${p.tithiNum}</dd></div>
      <div><dt>${L.nak}</dt><dd>${L.naks[p.nak]}</dd></div>
      <div><dt>${L.yog}</dt><dd>${L.yogas[p.yoga]}</dd></div>
      <div><dt>${L.kar}</dt><dd>${L.karanas[p.karana]}</dd></div>
      <div><dt>${L.vara}</dt><dd>${L.days[new Date(sel.y, sel.m, sel.d).getDay()]}</dd></div>
      <div><dt>${L.rituL}</dt><dd>${L.ritulist[p.ritu]}</dd></div>
      <div><dt>${L.rashiL}</dt><dd>${L.rashis[p.sunRashi]} / ${L.rashis[p.moonRashi]}</dd></div>
    </dl>
    <p class="place">${L.place}</p>`;
}

function renderGrid() {
  const L = T[lang], first = new Date(vy, vm, 1).getDay();
  $('#title').innerHTML = `${new Date(vy, vm, 1).toLocaleDateString(lang === 'hi' ? 'hi-IN' : 'en-IN', { month: 'long', year: 'numeric' })}`
    + (() => { const a = monthName(Panchang.day(vy, vm, 1)), b = monthName(Panchang.day(vy, vm, new Date(vy, vm + 1, 0).getDate()));
      return `<small>${a === b ? a : a + ' / ' + b} · ${L.vSamvat} ${Panchang.vikramSamvat(vy, vm, 15)}</small>`; })();
  $('#mSel').innerHTML = Array.from({ length: 12 }, (_, i) => `<option value="${i}"${i === vm ? ' selected' : ''}>${new Date(2000, i, 1).toLocaleDateString(lang === 'hi' ? 'hi-IN' : 'en-IN', { month: 'long' })}</option>`).join('');
  $('#dow').innerHTML = L.shortDays.map(d => `<div>${d}</div>`).join('');
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const o = norm({ y: vy, m: vm, d: 1 - first + i });
    if (i >= 35 && o.m !== vm) break;
    const p = P(o), out = o.m !== vm, sun = new Date(o.y, o.m, o.d).getDay() === 0;
    const show = p.events.filter(e => e.kind !== 'vrat' || /Ekadashi/.test(e.name));
    const kind = e => e.kind === 'vrat' ? 'v' : '';
    cells.push(`<button type="button" class="cell${out ? ' out' : ''}${same(o, sel) ? ' sel' : ''}${same(o, TODAY) ? ' today' : ''}${sun ? ' sunday' : ''}" data-y="${o.y}" data-m="${o.m}" data-d="${o.d}" role="gridcell" aria-label="${fmtLong(o, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}, ${L.tithis[p.tithiName]} ${L.pakshas[p.paksha]}${show.length ? ', ' + show.map(label).join(', ') : ''}"${same(o, sel) ? ' aria-selected="true"' : ''}>
      <span class="top"><span class="n">${o.d}</span><span class="t">${moonSVG(p.el, 7, 'var(--p1)', 'var(--line)')}<span>${p.paksha ? 'K' : 'S'}${p.tithiNum}</span></span></span>
      <span class="chips">${show.slice(0, 2).map(e => `<span class="chip ${kind(e)}">${label(e)}</span>`).join('')}</span>
      <span class="dots">${show.slice(0, 3).map(e => `<i class="${kind(e)}"></i>`).join('')}</span>
    </button>`);
  }
  $('#grid').innerHTML = cells.join('');
  $('#ySel').value = vy;
}

function renderNext() {
  const L = T[lang], base = new Date(sel.y, sel.m, sel.d), rows = [];
  for (let i = 1; i < 150 && rows.length < 6; i++) {
    const o = norm({ y: base.getFullYear(), m: base.getMonth(), d: base.getDate() + i });
    for (const e of P(o).events) {
      if (e.kind === 'vrat' && !/Ekadashi/.test(e.name)) continue;
      rows.push({ o, e, i });
      if (rows.length >= 6) break;
    }
  }
  $('#next').innerHTML = `<h2>${L.nextUp}</h2><ul>${rows.map(({ o, e, i }) => `<li><button type="button" data-y="${o.y}" data-m="${o.m}" data-d="${o.d}">
    <span class="dd">${o.d}<small>${fmtLong(o, { month: 'short' })}</small></span>
    <span class="nm ${e.kind === 'vrat' ? 'v' : ''}">${label(e)}</span>
    <span class="when">${i === 1 ? L.tomorrow : L.inDays.replace('{n}', i)}</span></button></li>`).join('')}</ul>`;
}

function renderChrome() {
  const L = T[lang];
  document.documentElement.lang = lang === 'hi' ? 'hi' : 'en';
  $('#l-en').setAttribute('aria-pressed', lang === 'en'); $('#l-hi').setAttribute('aria-pressed', lang === 'hi');
  $('#todayBtn').textContent = L.today;
  $('#prev').setAttribute('aria-label', L.prev); $('#nextM').setAttribute('aria-label', L.next);
  $('#themeBtn').innerHTML = ICON[theme];
  $('#themeBtn').setAttribute('aria-label', theme === 'dark' ? L.themeDark : theme === 'light' ? L.themeLight : L.themeAuto);
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme;
}
function applyColor() {
  const [a, b] = COLORS[colorIdx], st = document.documentElement.style;
  st.setProperty('--p1', a); st.setProperty('--p2', b);
  $('#swatches').setAttribute('aria-label', T[lang].colorL);
  $('#swatches').innerHTML = COLORS.map(([x, y], i) => `<button type="button" class="sw" style="--a:${x};--b:${y}" data-c="${i}" aria-pressed="${i === colorIdx}" aria-label="${T[lang].colours[i]}" title="${T[lang].colours[i]}"></button>`).join('');
  document.querySelector('meta[name=theme-color]').content = b;
}
function fillWatermark() {
  const n = Math.ceil(innerWidth / 52) * Math.ceil(innerHeight / 52);
  $('#wm').innerHTML = Array.from({ length: n }, (_, i) => `<span>${(i + Math.floor(i / Math.ceil(innerWidth / 52))) % 2 ? '卐' : 'ॐ'}</span>`).join('');
}
function renderAll() { applyColor(); renderChrome(); renderGrid(); renderPanel(); renderNext(); }

function select(o) {
  sel = norm(o);
  if (sel.y !== vy || sel.m !== vm) { vy = sel.y; vm = sel.m; renderGrid(); }
  else { document.querySelectorAll('.cell.sel').forEach(c => { c.classList.remove('sel'); c.removeAttribute('aria-selected'); });
    const c = document.querySelector(`.cell[data-y="${sel.y}"][data-m="${sel.m}"][data-d="${sel.d}"]`); if (c) { c.classList.add('sel'); c.setAttribute('aria-selected', 'true'); } }
  renderPanel(); renderNext();
}
function go(dm) { const d = new Date(vy, vm + dm, 1); vy = d.getFullYear(); vm = d.getMonth(); renderGrid(); }

function wire() {
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-y]'); if (!b) return;
    select({ y: +b.dataset.y, m: +b.dataset.m, d: +b.dataset.d });
    if (b.closest('.next') && innerWidth < 1020) window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  $('#prev').onclick = () => go(-1); $('#nextM').onclick = () => go(1);
  $('#mSel').onchange = e => { vm = +e.target.value; renderGrid(); };
  $('#ySel').onchange = e => { vy = +e.target.value; renderGrid(); };
  $('#swatches').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; colorIdx = +b.dataset.c; store.set('hc-color', colorIdx); applyColor(); };
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(fillWatermark, 200); });
  $('#todayBtn').onclick = () => select({ ...TODAY });
  $('#l-en').onclick = () => { lang = 'en'; store.set('hc-lang', lang); renderAll(); };
  $('#l-hi').onclick = () => { lang = 'hi'; store.set('hc-lang', lang); renderAll(); };
  $('#themeBtn').onclick = () => { theme = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto'; store.set('hc-theme', theme); renderChrome(); };
  document.addEventListener('keydown', e => {
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
    if (step) { e.preventDefault(); select({ y: sel.y, m: sel.m, d: sel.d + step }); document.querySelector('.cell.sel')?.focus(); }
    else if (e.key === 'PageDown') go(1); else if (e.key === 'PageUp') go(-1);
    else if (e.key === 't' || e.key === 'T') select({ ...TODAY });
  });
}

(async () => {
  try { T = await (await fetch('data.json')).json(); }
  catch (e) { document.body.insertAdjacentHTML('afterbegin', '<p style="padding:16px;color:#b8301f">Could not load data.json. Open this page over http (GitHub Pages or a local server), not file://.</p>'); return; }
  $('#ySel').innerHTML = Array.from({ length: 101 }, (_, i) => `<option>${2000 + i}</option>`).join('');
  wire(); renderAll(); fillWatermark();
})();
</script>
<script>
// Mobile menu: toggles the site nav, closes on link, outside click, Escape, or when the screen widens.
(function(){var b=document.getElementById('menuBtn'),n=document.getElementById('menuNav');if(!b||!n)return;
function set(o){n.classList.toggle('open',o);b.setAttribute('aria-expanded',o);}
b.addEventListener('click',function(e){e.stopPropagation();set(!n.classList.contains('open'));});
n.addEventListener('click',function(e){if(e.target.closest('a'))set(false);});
document.addEventListener('click',function(e){if(!e.target.closest('.site'))set(false);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&n.classList.contains('open')){set(false);b.focus();}});
matchMedia('(min-width:761px)').addEventListener('change',function(e){if(e.matches)set(false);});})();
</script>
</body>
</html>
