<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember Studio | Crochet Pattern Designer</title>
<meta name="description" content="Design a crochet pattern in the browser: pick a shape, paint or stamp stitches, preview it as yarn and export a printable stitch-map PDF.">
<meta name="theme-color" content="#d44a06">
<link rel="icon" href="../../master/logo_favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,wght@1,600;1,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#f3efea; --panel:#fff; --panel2:#f0ebe5; --ink:#201b17; --mute:#6a6159; --line:#ddd5cb;
  --ember:#d44a06; --on-ember:#fff; --soft:#fde4d3; --danger:#b8301f; --grid:rgba(0,0,0,.13);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141110; --panel:#201c19; --panel2:#2a2521; --ink:#f3ece4; --mute:#a99f95; --line:#38312c;
  --ember:#ff7a30; --on-ember:#1a0e05; --soft:#3a2415; --danger:#ff7a63; --grid:rgba(0,0,0,.16);
}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;font-size:1rem;line-height:1.45;
  -webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
h2{font-size:1rem;font-weight:700;margin-bottom:10px}

/* top bar */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:'Fraunces',serif;font-style:italic;font-weight:700;font-size:1.5rem;text-decoration:none;color:var(--ember);line-height:1;margin-right:auto}
.brand small{font-family:'Figtree',sans-serif;font-style:normal;font-weight:600;font-size:.8rem;color:var(--mute);margin-left:6px}
.ibtn,.btn{min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ibtn{min-width:42px;padding:0}
.ibtn:hover,.btn:hover{border-color:var(--ink)}
.ibtn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--ember);color:var(--on-ember);border-color:var(--ember)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.btn.primary:disabled{border-color:var(--ember)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.92rem;border-radius:10px}
.btn[aria-pressed="true"]{background:var(--soft);border-color:var(--ember);color:var(--ember)}

/* layout */
.studio{display:grid;gap:16px;padding:16px 16px 92px;max-width:1700px;margin:0 auto}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:none;min-width:0}
.studio[data-tab="draw"] .draw,.studio[data-tab="library"] .library,.studio[data-tab="preview"] .preview,.studio[data-tab="layers"] .layers{display:block}
.side{display:contents}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:600;color:var(--mute)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--ember)}
@media (min-width:1100px){
  .studio{grid-template-columns:300px minmax(0,1fr) 400px;align-items:start;padding-bottom:24px}
  .pane{display:block!important}
  .library{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
  .side{display:flex;flex-direction:column;gap:16px}
  .tabs{display:none}
}

/* library */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:6px 14px;font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:var(--on-ember)}
.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:20px}
.shape{border:2px solid transparent;background:var(--panel2);border-radius:14px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;font-weight:600;text-align:center;line-height:1.15}
.shape svg{width:34px;height:34px;fill:var(--mute)}
.shape[aria-pressed="true"]{border-color:var(--ember);background:var(--soft)}
.shape[aria-pressed="true"] svg{fill:var(--ember)}
.stampbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.motifs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.motif{border:2px solid transparent;background:var(--panel2);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:600;text-align:center;line-height:1.1}
.motif span:first-child{font-size:1.4rem;line-height:1.2}
.motif[aria-pressed="true"]{border-color:var(--ember);background:var(--soft)}

/* draw */
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.mode{font-weight:700;padding:5px 14px;border-radius:99px;background:var(--soft);color:var(--ember);margin-right:auto;font-size:.92rem}
.canvaswrap{width:min(100%,calc(100vh - 230px));min-width:260px;margin:0 auto}
#editorCanvas{display:block;width:100%;aspect-ratio:1/1;background:#fff;border:2px solid var(--ink);border-radius:6px;touch-action:none;cursor:crosshair}
.palette{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;justify-content:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
input[type=color]{width:34px;height:34px;border:0;border-radius:50%;padding:0;background:none;cursor:pointer}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin-top:16px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel2);border-radius:12px;padding:8px 12px;min-height:46px}
.row label{font-weight:600;font-size:.9rem;white-space:nowrap}
.row input[type=range]{flex:1;min-width:60px;accent-color:var(--ember)}
.row output,.row select{font-weight:700;font-size:.9rem}
.row select{background:transparent;border:0;flex:1;text-align:right}
.seg{display:inline-flex;gap:4px;margin-left:auto}
.seg button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ember);color:var(--on-ember);border-color:var(--ember)}

/* preview */
.stage{position:relative;width:100%;aspect-ratio:1/1;max-height:70vh;margin:0 auto;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#b40e0e;perspective:1000px}
.zoomw{width:80%;height:80%;display:flex;align-items:center;justify-content:center;transition:transform .2s ease-out}
.mask{width:100%;height:100%;mask-size:contain;mask-repeat:no-repeat;mask-position:center;-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center;background-repeat:repeat}
.pname{text-align:center;font-weight:700;margin:10px 0 12px}
.stack{display:grid;gap:8px}

/* layers */
.lhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.lhead h2{margin:0}
.layer{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel);cursor:pointer}
.layer[aria-current="true"]{border-color:var(--ember);background:var(--soft)}
.layer .nm{flex:1;min-width:0;font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);flex:none}
.layer .eye{border:0;background:none;font-size:1.05rem}
.layers .list{max-height:340px;overflow:auto}

/* dialogs */
dialog{border:0;border-radius:22px;padding:22px;background:var(--panel);color:var(--ink);width:min(92vw,460px);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
dialog h3{font-family:'Fraunces',serif;font-style:italic;font-size:1.35rem;margin-bottom:14px;text-align:center}
dialog input[type=text],dialog select{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px 12px;margin-bottom:12px}
dialog .acts{display:flex;gap:10px;margin-top:6px}
dialog .acts .btn{flex:1}
#emojiGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:4px;max-height:50vh;overflow:auto;margin-bottom:12px}
#emojiGrid button{font-size:1.7rem;padding:6px;border:0;background:none;border-radius:12px}
#emojiGrid button:hover{background:var(--soft)}
#reportModal{width:min(96vw,1200px);padding:0;overflow:hidden}
#reportModal .rh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
#reportModal .rh h3{margin:0;text-align:left}
#reportModal .rb{padding:14px;overflow:auto;max-height:calc(90vh - 150px);background:var(--panel2)}
#modalPrintArea{overflow:hidden;margin:0 auto;background:#fff;border-radius:6px}
#reportModal .rf{display:flex;flex-wrap:wrap;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
#reportModal .rf .btn{flex:1;min-width:140px}
#hover{position:fixed;pointer-events:none;z-index:3000;display:none;width:156px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#hover canvas{width:140px;height:140px;border-radius:8px;background:var(--panel2);image-rendering:pixelated;display:block}
.bar .btn{padding:0 12px}
@media (max-width:560px){.bar{gap:6px;padding:10px 12px}.lg,.brand small{display:none}.brand{font-size:1.3rem}.bar .btn.danger{padding:0 11px}}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:3500}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:1100px){#toast{bottom:28px}}
.foot{text-align:center;color:var(--mute);font-size:.85rem;padding:0 16px 24px}
.foot a{color:inherit}
@media (prefers-reduced-motion:reduce){.zoomw{transition:none}}
</style>
</head>
<body>
<div id="hover"><canvas id="hoverPreviewCanvas" width="140" height="140"></canvas></div>

<header class="bar">
  <a class="brand" href="../" aria-label="Ember home">Emberloom<small>Studio</small></a>
  <button class="ibtn" id="undoBtn" onclick="undo()" aria-label="Undo" title="Undo (Ctrl+Z)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="ibtn" id="redoBtn" onclick="redo()" aria-label="Redo" title="Redo (Ctrl+Y)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="btn danger" onclick="clearAll()" aria-label="Clear design"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg><span class="lg">Clear</span></button>
  <button class="btn primary" onclick="openReportModal()">Export<span class="lg">pattern</span></button>
</header>

<main class="studio" id="studio" data-tab="draw">
  <section class="pane library" aria-label="Shapes and stamps">
    <h2>Shape</h2>
    <div class="chips" id="categoryContainer" role="group" aria-label="Shape categories"></div>
    <div class="shapes" id="silhouetteGrid"></div>
    <h2>Stamps</h2>
    <div class="stampbtns">
      <button class="btn sm" onclick="openTextStampModal()">Text</button>
      <button class="btn sm" onclick="$('emojiStampModal').showModal()">Emoji</button>
      <button class="btn sm" onclick="$('imageStampModal').showModal()">Image</button>
    </div>
    <div class="motifs" id="motifLibrary"></div>
  </section>

  <section class="pane draw" aria-label="Pattern canvas">
    <div class="dhead">
      <span class="mode" id="selectedLabel">Painting</span>
      <button class="btn sm primary" id="finalizeBtn" onclick="bakeStamp()" disabled>Place stamp</button>
      <button class="btn sm" id="cancelBtn" onclick="cancelStamp()" disabled>Cancel</button>
      <button class="btn sm" id="eraserBtn" aria-pressed="false" onclick="toggleEraser()">Eraser</button>
      <button class="btn sm" onclick="fillActiveLayer()">Fill</button>
      <button class="btn sm" onclick="clearActiveLayer()">Clear layer</button>
    </div>
    <div class="canvaswrap"><canvas id="editorCanvas" aria-label="Stitch grid. Tap or drag to paint."></canvas></div>
    <div class="palette" id="colorPalette" role="group" aria-label="Yarn colours"></div>
    <div class="opts">
      <div class="row"><label>Brush</label><div class="seg" id="brushSeg"><button aria-pressed="true" data-b="1">1</button><button aria-pressed="false" data-b="2">2</button><button aria-pressed="false" data-b="3">3</button></div></div>
      <div class="row"><label for="stampScale">Stamp size</label><input type="range" id="stampScale" min="0.5" max="4" step="0.1" value="1" oninput="updateStampScale(this.value)"><output id="stampScaleLabel">1.0x</output></div>
      <div class="row"><label for="gridSizeSelect">Resolution</label>
        <select id="gridSizeSelect" onchange="changeGridSize(this.value)">
          <option value="20">20 × 20 Standard</option><option value="32">32 × 32 Fine</option><option value="48" selected>48 × 48 Boutique</option><option value="64">64 × 64 Elite</option>
        </select></div>
    </div>
  </section>

  <div class="side">
    <section class="pane preview" aria-label="Preview">
      <h2>Preview</h2>
      <div class="stage" id="dropTarget"><div class="zoomw" id="zoomWrapper"><div class="mask" id="visualMask"></div></div></div>
      <p class="pname" id="currentSelection">Model</p>
      <div class="stack">
        <div class="row"><label for="globalScale">Stitch size</label><input type="range" id="globalScale" min="5" max="300" value="60" oninput="updateVisualScale(this.value)"><output id="scaleLabel">60px</output></div>
        <div class="row"><label for="tiltR">Tilt</label><input type="range" id="tiltR" min="-45" max="45" value="0" oninput="tiltPreview(this.value)"></div>
        <div class="row"><label for="zoomR">Zoom</label><input type="range" id="zoomR" min="0.5" max="2.5" step="0.1" value="1" oninput="zoomPreview(this.value)"></div>
        <div class="row"><label for="bgColorPicker">Background</label><input type="color" value="#b40e0e" id="bgColorPicker" oninput="updatePreviewBG(this.value)" style="margin-left:auto"></div>
      </div>
    </section>
    <section class="pane layers" aria-label="Layers">
      <div class="lhead"><h2>Layers</h2><button class="btn sm primary" onclick="addNewPaintLayer()">New layer</button></div>
      <div class="list" id="layersList"></div>
    </section>
  </div>
</main>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-t="draw" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Design</button>
  <button data-t="library" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Shapes</button>
  <button data-t="preview" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>Preview</button>
  <button data-t="layers" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7Z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></svg>Layers</button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<p class="foot">© 2026 Emberloom Crochet Studio · <a href="../">Back to Ember</a></p>

<!-- stamp dialogs -->
<dialog id="textStampModal" class="stamp"><h3>Text stamp</h3>
  <input type="text" id="textStampInput" maxlength="8" placeholder="Up to 8 characters" aria-label="Stamp text">
  <select id="textStampFont" aria-label="Font"><option value="serif">Classic serif</option><option value="sans-serif">Modern sans</option><option value="monospace">Digital mono</option></select>
  <div class="acts"><button class="btn" onclick="closeModals()">Cancel</button><button class="btn primary" onclick="processTextStamp()">Make stamp</button></div></dialog>
<dialog id="emojiStampModal" class="stamp" style="width:min(92vw,560px)"><h3>Emoji stamp</h3><div id="emojiGrid"></div><div class="acts"><button class="btn" onclick="closeModals()">Close</button></div></dialog>
<dialog id="imageStampModal" class="stamp"><h3>Image stamp</h3>
  <input type="file" id="imageStampInput" accept="image/*" aria-label="Choose an image" style="margin-bottom:12px;width:100%">
  <p style="color:var(--mute);font-size:.9rem;margin-bottom:12px">Dark areas of the image become stitches. Simple black-and-white logos work best.</p>
  <div class="acts"><button class="btn" onclick="closeModals()">Cancel</button><button class="btn primary" onclick="processImageStamp()">Make stamp</button></div></dialog>

<dialog id="reportModal">
  <div class="rh"><h3>Your crochet blueprint</h3><button class="ibtn" onclick="closeReportModal()" aria-label="Close">✕</button></div>
  <div class="rb"><div id="modalPrintArea"></div></div>
  <div class="rf"><button class="btn" onclick="downloadPNG()">Save picture (PNG)</button><button class="btn primary" onclick="generateFinalPDF()">Export PDF</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
        const boutiqueMotifs = [
            { id: 'ref-chevron', icon: '📐', name: 'Chevron' }, { id: 'ref-mandala', icon: '☸️', name: 'Mandala' },
            { id: 'ref-bobble', icon: '🧶', name: 'Bobble' }, { id: 'ref-zigzag', icon: '⚡', name: 'Zigzag' },
            { id: 'granny', icon: '🌸', name: 'Granny' }, { id: 'waffle', icon: '🧇', name: 'Waffle' },
            { id: 'check', icon: '🏁', name: 'Check' }, { id: 'ombre', icon: '🌈', name: 'Ombre' },
            { id: 'nordic', icon: '❄️', name: 'Nordic' }, { id: 'v-stitch', icon: '∨', name: 'V-Stitch' },
            { id: 'bubbles', icon: '🫧', name: 'Bubbles' }, { id: 'moss', icon: '🌿', name: 'Moss' },
            { id: 'star', icon: '⭐', name: 'Star' }, { id: 'diamond', icon: '💎', name: 'Diamond' },
            { id: 'spiral', icon: '🌀', name: 'Spiral' }, { id: 'heart', icon: '❤️', name: 'Heart' },
            { id: 'snowflake', icon: '❄️', name: 'Snowflake' }, { id: 'crescent', icon: '🌙', name: 'Crescent' },
            { id: 'paw', icon: '🐾', name: 'Paw' }, { id: 'leaf', icon: '🍃', name: 'Leaf' },
            { id: 'lattice', icon: '🕸️', name: 'Lattice' }, { id: 'cross', icon: '❌', name: 'Cross' },
            { id: 'border', icon: '➰', name: 'Border' }, { id: 'dots-lg', icon: '🔴', name: 'Dots LG' },
            { id: 'tri', icon: '🔺', name: 'Triangles' }, { id: 'clover', icon: '🍀', name: 'Clover' },
            { id: 'stripes', icon: '📏', name: 'Stripes' }, { id: 'harlequin', icon: '🃏', name: 'Harlequin' },
            { id: 'mosaic', icon: '🧱', name: 'Mosaic' }, { id: 'waves', icon: '🌊', name: 'Waves' }
        ];

function isMotifActive(motifId, x, y, cx, cy, layerScale, bits) {

                case 'star': { let angle = Math.atan2(dy, dx); let r = 8 * (0.5 + 0.5 * Math.cos(5 * angle)); return d < r; }

                case 'clover': return Math.sqrt((dx - 2.5) ** 2 + (dy + 2.5) ** 2) < 2.5 || Math.sqrt((dx + 2.5) ** 2 + (dy + 2.5) ** 2) < 2.5 || Math.sqrt((dx - 2.5) ** 2 + (dy - 2.5) ** 2) < 2.5 || Math.sqrt((dx + 2.5) ** 2 + (dy - 2.5) ** 2) < 2.5;
                case 'paw': return d < 3 || Math.sqrt((dx - 2) ** 2 + (dy + 2.5) ** 2) < 1.5 || Math.sqrt((dx + 2) ** 2 + (dy + 2.5) ** 2) < 1.5 || Math.sqrt(dx ** 2 + (dy + 3) ** 2) < 1.5;
                case 'crescent': return (d < 7) && (Math.sqrt((dx - 3) ** 2 + dy ** 2) > 6);
                case 'leaf': return Math.abs(dx) < (4 - Math.abs(dy / 1.2)) && Math.abs(dy) < 8;
                case 'waves': return dy > Math.sin(dx / 2) * 2;
                case 'check': return (Math.floor(x / 4) + Math.floor(y / 4)) % 2 === 0;
                case 'nordic': return Math.abs(dx) === Math.abs(dy) || dx === 0 || dy === 0;
                case 'v-stitch': return (x + y) % 4 === 0 || (x - y) % 4 === 0;
                case 'stripes': return Math.floor(x / 2) % 2 === 0;
                case 'lattice': return (x + y) % 5 == 0 || (x - y) % 5 == 0;
                case 'cross': return Math.abs(dx) === Math.abs(dy) && d < 8;
                case 'border': return x === 0 || x === gridSize - 1 || y === 0 || y === gridSize - 1;
                case 'dots-lg': return (x % 5 == 2 && y % 5 == 2);

                case 'bubbles': return (x % 5 === 0 && y % 5 === 0);
                case 'moss': return (x + y) % 2 === 0;
                case 'spiral': return Math.floor(d + Math.atan2(dy, dx) * 3) % 2 === 0 && d < 10;

}

function compositeGrid() {
    const final = Array(gridSize * gridSize).fill('#ffffff');
    layers.forEach(layer => {
        if (!layer.visible) return;
        for (let i = 0; i < final.length; i++) {

            if (layer.type === 'paint') { if (layer.data[i]) final[i] = layer.data[i]; }
            else if (isMotifActive(layer.motifId, x, y, layer.cx, layer.cy, layer.scale, layer.bits)) final[i] = layer.color;
        }

    return final;
}

let texQueued = false;
function renderGrid() {

        ctx.stroke();
    }
    if (!texQueued) { texQueued = true; requestAnimationFrame(() => { texQueued = false; updateLiveTexture(); }); }
}

function updateLiveTexture() {
    const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d'), step = 512 / gridSize, data = compositeGrid();
    data.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect((i % gridSize) * step, Math.floor(i / gridSize) * step, step, step); });
    if (ghostStamp) {
        ctx.fillStyle = currentColor;
        for (let i = 0; i < data.length; i++) if (isMotifActive(ghostStamp.id, i % gridSize, Math.floor(i / gridSize), ghostStamp.x, ghostStamp.y, currentStampScale, customBits)) ctx.fillRect((i % gridSize) * step, Math.floor(i / gridSize) * step, step, step);
    }
    $('visualMask').style.backgroundImage = `url(${canvas.toDataURL()})`;
}

function paintAt(x, y) {
    const layer = layers[activeLayerIndex];
    if (!layer || layer.type !== 'paint') return;
    const v = erasing ? null : currentColor;
    for (let dy = 0; dy < brush; dy++) for (let dx = 0; dx < brush; dx++) {
        const px = x + dx - Math.floor((brush - 1) / 2), py = y + dy - Math.floor((brush - 1) / 2);

}
function act(e) {

// --- HISTORY + AUTOSAVE ---
function saveHistory() {
    const d = JSON.stringify(layers);
    if (historyIndex < historyStack.length - 1) historyStack = historyStack.slice(0, historyIndex + 1);
    if (historyStack[historyIndex] === d) return;
    historyStack.push(d); if (historyStack.length > 40) historyStack.shift(); historyIndex = historyStack.length - 1;
    updateHistoryButtons(); persist();
}
function restoreHistory() { layers = JSON.parse(historyStack[historyIndex]); activeLayerIndex = Math.min(activeLayerIndex, layers.length - 1); renderLayersUI(); renderGrid(); updateHistoryButtons(); persist(); }
function undo() { if (historyIndex > 0) { historyIndex--; restoreHistory(); } }
function redo() { if (historyIndex < historyStack.length - 1) { historyIndex++; restoreHistory(); } }
function updateHistoryButtons() { $('undoBtn').disabled = historyIndex <= 0; $('redoBtn').disabled = historyIndex >= historyStack.length - 1; }
let saveT;
function persist() {
    clearTimeout(saveT);
    saveT = setTimeout(() => { try { localStorage.setItem('ember-studio-v2', JSON.stringify({ layers, gridSize, cat: currentCatId, item: currentItem.id, color: currentColor })); } catch (e) {} }, 400);
}
function loadSaved() {
    try {
        const s = JSON.parse(localStorage.getItem('ember-studio-v2') || 'null');
        if (!s || !Array.isArray(s.layers) || !s.layers.length) return false;
        gridSize = s.gridSize; layers = s.layers; currentColor = s.color || currentColor;
        if (library[s.cat]) { currentCatId = s.cat; currentItem = library[s.cat].items.find(i => i.id === s.item) || library[s.cat].items[0]; }
        $('gridSizeSelect').value = gridSize; activeLayerIndex = layers.length - 1; return true;
    } catch (e) { return false; }
}

// --- PREVIEW CONTROLS ---
function updateVisualScale(v) { $('visualMask').style.backgroundSize = `${v}px ${v}px`; $('scaleLabel').innerText = `${v}px`; }
function updatePreviewBG(c) { $('dropTarget').style.background = c; }
function tiltPreview(v) { $('visualMask').style.transform = `rotateY(${v}deg)`; }
function zoomPreview(v) { $('zoomWrapper').style.transform = `scale(${v})`; }
function toggleLayerVisibility(i) { layers[i].visible = !layers[i].visible; renderLayersUI(); renderGrid(); saveHistory(); }
function removeLayer(i) { if (layers.length > 1) { layers.splice(i, 1); activeLayerIndex = Math.min(activeLayerIndex, layers.length - 1); renderLayersUI(); renderGrid(); saveHistory(); } }
function moveLayer(i, dir) { const n = i + dir; if (n >= 0 && n < layers.length) { [layers[i], layers[n]] = [layers[n], layers[i]]; activeLayerIndex = n; renderLayersUI(); renderGrid(); saveHistory(); } }

function createPalette() {
    const c = $('colorPalette'); c.innerHTML = '';
    palette.forEach(color => {
        const b = document.createElement('button'); b.className = 'sw'; b.style.background = color; b.setAttribute('aria-label', `Yarn ${color}`);
        b.setAttribute('aria-pressed', color.toLowerCase() === currentColor.toLowerCase());
        b.onclick = () => { setColor(color); }; c.appendChild(b);
    });
    const p = document.createElement('input'); p.type = 'color'; p.value = currentColor; p.setAttribute('aria-label', 'Custom colour');
    p.onchange = e => setColor(e.target.value); c.appendChild(p);
}
function setColor(color) { currentColor = color; if (erasing) toggleEraser(); createPalette(); renderGrid(); persist(); }

// --- TABS (small screens) ---
function setTab(t, soft) {
    if (soft && matchMedia('(min-width:1100px)').matches) return;
    $('studio').dataset.tab = t;
    document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t));
    window.scrollTo({ top: 0 });
}

// --- EXPORT ---
function fitReport() {
    const area = $('modalPrintArea'), root = $('pdf-root'); if (!root) return;
    const s = Math.min(1, ($('reportModal').querySelector('.rb').clientWidth - 28) / 1122);
    root.style.transformOrigin = '0 0'; root.style.transform = `scale(${s})`;
    area.style.width = `${1122 * s}px`; area.style.height = `${794 * s}px`;
}
addEventListener('resize', () => { if ($('reportModal').open) fitReport(); });
function openReportModal() {
    bakeStamp(); const area = $('modalPrintArea');
            const data = compositeGrid(); const usedColors = [...new Set(data)].filter(c => c !== '#ffffff');
            const studioBG = document.getElementById('bgColorPicker').value;
            const currentScale = document.getElementById('globalScale').value;
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const pCtx = canvas.getContext('2d'); const step = 512 / gridSize;
            data.forEach((c, i) => { pCtx.fillStyle = c; pCtx.fillRect((i % gridSize) * step, Math.floor(i / gridSize) * step, step, step); });
            const patternData = canvas.toDataURL();
            const reportPatternSize = (currentScale / 4.16) || 15;
            const totalCells = gridSize * gridSize;
            const coveragePerc = Math.ceil((data.filter(c => c !== '#ffffff').length / totalCells) * 100);

            const rowNums = Array.from({ length: gridSize }, (_, i) => `<div style="height: ${535 / gridSize}px; display: flex; align-items: center; justify-content: flex-end; font-size: 7px; font-weight: 800; color: #999; padding-right: 5px;">${i + 1}</div>`).join('');
            const colNums = Array.from({ length: gridSize }, (_, i) => `<div style="flex: 1; text-align: center; font-size: 7px; font-weight: 800; color: #999;">${i + 1}</div>`).join('');

            // EDGE-TO-EDGE PDF ARCHITECTURE - CALIBRATED FOR ZERO-OFFSET PRINTING
            area.innerHTML = `
                <div id="pdf-root" style="display: flex; width: 1122px; height: 794px; background: white; margin: 0; padding: 40px; box-sizing: border-box; overflow: hidden; position: relative; gap: 0;">
                    <!-- LEFT 40% DATA HUB -->
                    <div style="flex: 0 0 380px; border-right: 2px dashed #eee; padding-right: 30px; display: flex; flex-direction: column; box-sizing: border-box;">
                        <div style="border-bottom: 5px solid #f97316; padding-bottom: 10px; margin-bottom: 25px;"><h3 style="font-size: 30px; font-family: serif; color: #111; margin: 0; text-align: center;">Emberloom Crochet Studio</h3></div>
                        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: ${studioBG}; padding: 30px; border-radius: 40px; text-align: center; margin-bottom: 30px; border: 1px solid #ddd; box-shadow: inset 0 0 20px rgba(0,0,0,0.15);">
                            <svg width="280" height="280" viewBox="0 0 100 100" style="margin: 0 auto;"><defs><pattern id="repPat" patternUnits="userSpaceOnUse" width="${reportPatternSize}" height="${reportPatternSize}"><image href="${patternData}" width="${reportPatternSize}" height="${reportPatternSize}" /></pattern></defs><path d="${currentItem.path}" fill="url(#repPat)" stroke="#fff" stroke-width="0.3" /></svg>
                            <p style="color: white; font-weight: 800; text-transform: uppercase; margin-top: 25px; letter-spacing: 4px; font-size: 16px; text-shadow: 0 2px 4px rgba(0,0,0,0.4);">${currentItem.name}</p>
                        </div>
                        <div style="display: grid; gap: 15px;">
                            <div style="background: #f9f7f4; padding: 20px; border-radius: 20px; border: 1px solid #eee;"><h4 style="font-size: 10px; color: #bbb; text-transform: uppercase; margin-bottom: 8px; font-weight: 900; letter-spacing: 2px;">TECHNICAL DATA</h4><p style="font-size: 11px; color: #333; line-height: 1.5; margin: 0; font-weight: 700;">Resolution: ${gridSize}x${gridSize}<br>Stitches: ${totalCells}<br>Coverage: ${coveragePerc}%</p></div>
                            <div style="background: #f9f7f4; padding: 20px; border-radius: 20px; border: 1px solid #eee;"><h4 style="font-size: 10px; color: #bbb; text-transform: uppercase; margin-bottom: 8px; font-weight: 900; letter-spacing: 2px;">PALETTE</h4><div style="display: flex; flex-wrap: wrap; gap: 8px;">${usedColors.map(c => `<div style="width: 18px; height: 18px; border-radius: 50%; background: ${c}; border: 1px solid #ddd;"></div>`).join('')}</div></div>
                        </div>
                    </div>
                    <!-- RIGHT 60% DRAFTING TABLE -->
                    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-left: 30px; box-sizing: border-box;">
                        <h4 style="font-size: 14px; color: #bbb; text-transform: uppercase; margin-bottom: 30px; font-weight: 800; text-align: center; letter-spacing: 5px;">Master Stitch Map Blueprint</h4>
                        <div style="position: relative;">
                             <div style="position: absolute; left: 15px; top: 10px; right: 10px; bottom: 10px; border: 1.5px dotted #ddd; pointer-events: none;"></div>
                             <div style="display: flex;"><div style="width: 25px; display: flex; flex-direction: column;">${rowNums}</div>
                             <div style="width: 535px; height: 535px; background: #222; border: 3px solid #222; display: grid; grid-template-columns: repeat(${gridSize}, 1fr); gap: 1px; overflow: hidden; border-radius: 4px; box-shadow: 0 15px 40px rgba(0,0,0,0.15);">${data.map(c => `<div style="background:${c};"></div>`).join('')}</div></div>
                             <div style="margin-left: 25px; width: 535px; display: flex; padding-top: 10px;">${colNums}</div>
                        </div>
                        <div style="margin-top: auto; padding-top: 30px; width: 100%; border-top: 2px dashed #eee; display: flex; justify-content: space-between; align-items: center;">
                            <p style="font-size: 10px; color: #ccc; font-weight: 700; text-transform: uppercase;">ROW 1 (TOP) TO ROW ${gridSize} (BOTTOM)</p>
                            <div style="text-align: right;">
                                <p style="font-size: 11px; color: #111; font-weight: 800; margin: 0; text-transform: uppercase; letter-spacing: 1px;">ID: #${Math.floor(Math.random() * 1000000)}</p>
                                <p style="font-size: 9px; color: #888; font-weight: 600; margin: 0; text-transform: uppercase;">EXPORT: ${new Date().toLocaleDateString()} @ ${new Date().toLocaleTimeString()}</p>
                            </div>
                        </div>
                    </div>
                </div>`;
    $('reportModal').showModal(); fitReport();
}
function closeReportModal() { $('reportModal').close(); }
async function generateFinalPDF() {
    const root = $('pdf-root'); if (!root) return;
    const prev = root.style.transform; root.style.transform = 'none';
    try {
        await html2pdf().set({ margin: 0, filename: 'EMBERLOOM_BLUEPRINT.pdf', image: { type: 'jpeg', quality: 1.0 },
            html2canvas: { scale: 2, useCORS: true, letterRendering: true, scrollY: 0, scrollX: 0, x: 0, y: 0, windowWidth: 1122 },
            jsPDF: { unit: 'px', format: [1122, 794], orientation: 'landscape' } }).from(root).save();
    } finally { root.style.transform = prev; }
    closeReportModal();
}
function downloadPNG() {
    const cell = Math.floor(1024 / gridSize), c = document.createElement('canvas'); c.width = c.height = cell * gridSize;
    const ctx = c.getContext('2d'); compositeGrid().forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect((i % gridSize) * cell, Math.floor(i / gridSize) * cell, cell, cell); });
    const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = 'emberloom-pattern.png'; a.click();
}

// --- INIT ---
function init() {
    const eg = $('emojiGrid');
    emojiPool.forEach(e => { const b = document.createElement('button'); b.innerText = e; b.setAttribute('aria-label', `Emoji ${e}`); b.onclick = () => processEmojiStamp(e); eg.appendChild(b); });
    const restored = loadSaved();
    createPalette(); renderCategories(); renderMotifs(); setCategory(currentCatId);
    if (restored) { renderLayersUI(); renderGrid(); saveHistory(); } else resetCanvas();
    updateVisualScale($('globalScale').value);

    const cv = $('editorCanvas');
    cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); isDrawing = true; lastCell = -1; act(e); });
    cv.addEventListener('pointermove', e => { if (isDrawing) act(e); });
    const end = () => { if (isDrawing) { isDrawing = false; saveHistory(); } };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    $('brushSeg').onclick = e => { const b = e.target.closest('[data-b]'); if (!b) return; brush = +b.dataset.b; document.querySelectorAll('#brushSeg button').forEach(x => x.setAttribute('aria-pressed', x === b)); };
    $('tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) setTab(b.dataset.t); };
    updateHistoryButtons();
}
addEventListener('keydown', e => {
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); redo(); }
    if (e.key === 'Escape' && selectedMotifId) cancelStamp();
});
window.onload = init;
</script>
